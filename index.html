<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daffa &amp; Jelita</title>
<meta name="description" content="Buku kenangan Daffa dan Jelita.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/extras.css">
</head>
<body>
<div class="desk" aria-hidden="true"></div>
<div class="candle-light" aria-hidden="true"></div>
<header class="top">
  <span class="top__brand" id="brand">Daffa &amp; Jelita</span>
  <span class="chip" id="chip"></span>
  <div class="player" id="player" hidden>
    <button class="player__btn" id="playBtn" type="button" aria-label="Putar musik">▶</button>
    <div class="player__info"><span class="player__title" id="songTitle"></span><span class="player__bar"><i id="progress"></i></span></div>
    <button class="player__next" id="nextBtn" type="button" aria-label="Lagu berikutnya" hidden>⏭</button>
    <span class="viz" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </div>
</header>
<main class="stage">
  <div class="book book--closed" id="book" tabindex="0" aria-label="Buku kenangan. Gunakan tombol panah atau geser untuk membalik halaman.">
    <i class="edge edge--l" aria-hidden="true"></i><i class="edge edge--r" aria-hidden="true"></i><i class="tail" aria-hidden="true"></i>
    <div class="book__spread" id="bookSpread"></div>
  </div>
  <noscript><p>Aktifkan JavaScript untuk membuka buku ini.</p></noscript>
</main>
<footer class="ctl">
  <div class="ctl__nav">
    <button class="icon-btn" id="bookPrev" type="button" aria-label="Halaman sebelumnya">‹</button>
    <span id="bookCount" aria-live="polite"></span>
    <button class="icon-btn" id="bookNext" type="button" aria-label="Halaman berikutnya">›</button>
  </div>
  <div class="ctl__tools">
    <button class="icon-btn icon-btn--sm" id="stickBtn" type="button" aria-label="Tempel stiker" aria-pressed="false">🎀</button>
    <button class="icon-btn icon-btn--sm" id="autoBtn" type="button" aria-label="Mode cerita otomatis" aria-pressed="false">▶</button>
    <button class="icon-btn icon-btn--sm" id="menuBtn" type="button" aria-label="Menu ajaib" aria-pressed="false">✨</button>
    <button class="icon-btn icon-btn--sm" id="labBtn" type="button" aria-label="Kotak fitur" aria-pressed="false">🎁</button>
  </div>
</footer>
<div class="menu" id="menu" role="group" aria-label="Menu ajaib" hidden>
  <button type="button" id="mCandle" aria-pressed="false"><b>🕯️</b><span>Suasana lilin</span></button>
  <button type="button" id="mPetal"><b>💐</b><span>Hujan kelopak</span></button>
  <button type="button" id="mRandom"><b>🎲</b><span>Acak kenangan</span></button>
  <button type="button" id="mPaper"><b>🎨</b><span>Warna kertas</span></button>
  <button type="button" id="mSleep" aria-pressed="false"><b>🌙</b><span>Timer tidur</span></button>
  <button type="button" id="mFull"><b>⛶</b><span>Layar penuh</span></button>
  <button type="button" id="mSparkle" aria-pressed="true"><b>✨</b><span>Jejak kilau</span></button>
  <button type="button" id="mBalloon"><b>🎈</b><span>Balon hati</span></button>
  <button type="button" id="mRain" aria-pressed="false"><b>🌧️</b><span>Suara hujan</span></button>
  <button type="button" id="mMark"><b>🔖</b><span>Tandai halaman</span></button>
  <button type="button" id="mGoMark"><b>📑</b><span>Ke penanda</span></button>
  <button type="button" id="mFav"><b>💗</b><span>Foto favorit</span></button>
  <button type="button" id="sfxBtn" aria-pressed="true"><b id="sfxIcon">🔊</b><span>Suara halaman</span></button>
</div>
<button class="cat" id="cat" type="button" aria-label="Kucing kecil">🐱</button>
<div class="tray" id="tray" role="group" aria-label="Tempel stiker" hidden>
  <p class="tray__hint">Pilih stiker, lalu ketuk halaman untuk menempel. Ketuk stiker untuk melepas.</p>
  <div class="tray__row" id="trayRow"></div>
  <div class="tray__act"><button type="button" id="trayClear">Hapus di halaman ini</button><button type="button" id="trayDone">Selesai</button></div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Pratinjau foto" hidden>
  <button class="lb__fav" id="lbFav" type="button" aria-label="Tandai favorit">♡</button>
  <button class="lb__close" id="lbClose" type="button" aria-label="Tutup">✕</button>
  <button class="lb__nav lb__prev" id="lbPrev" type="button" aria-label="Sebelumnya">‹</button>
  <button class="lb__nav lb__next" id="lbNext" type="button" aria-label="Berikutnya">›</button>
  <div class="lb__body"><img id="lbImg" alt=""><div class="lb__meta" id="lbMeta"></div></div>
</div>
<audio id="audio" preload="none"></audio>

<script src="js/config.js"></script>
<script src="js/quotes.js"></script>
<script src="js/gallery.js"></script>
<script src="js/app.js"></script>
<script src="js/extras.js"></script>
</body>
</html>
