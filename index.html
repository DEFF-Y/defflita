<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daffa &amp; Jelita</title>
<meta name="description" content="Galeri pribadi Daffa dan Jelita.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav" id="nav">
  <a class="nav__brand" href="#home" id="brand">D &amp; J</a>
  <nav class="nav__links" id="navLinks" aria-label="Navigasi utama">
    <a href="#home">Beranda</a><a href="#awal">Awal</a><a href="#timeline">Perjalanan</a><a href="#galeri">Momen</a><a href="#kutipan">Kutipan</a>
  </nav>
  <button class="icon-btn nav__toggle" id="menuBtn" type="button" aria-label="Buka menu" aria-expanded="false">☰</button>
</header>

<main>
<section class="hero" id="home">
  <div class="hero__bg" id="heroBg"></div>
  <span class="hero__ring" aria-hidden="true"></span>
  <div class="hero__content">
    <h1 class="hero__names"><span id="heroName1"></span><span class="hero__amp" aria-hidden="true">&amp;</span><span id="heroName2"></span></h1>
    <p class="hero__date" id="heroDate"></p>
    <p class="hero__phrase" id="heroPhrase"></p>
  </div>
  <a class="hero__scroll" href="#hitung" aria-label="Gulir ke bawah"><span></span></a>
</section>

<section class="section center reveal" id="hitung">
  <p class="label" id="counterSince"></p>
  <div class="counter" id="counter" aria-live="off"></div>
</section>

<section class="section split reveal" id="awal">
  <div class="split__text">
    <p class="label">Tempat Semuanya Bermula</p>
    <h2 id="placeName"></h2>
    <p id="placeText"></p>
  </div>
  <figure class="frame" id="placeFrame"></figure>
</section>

<section class="section split split--rev reveal" id="firstdate">
  <figure class="frame" id="dateFrame"></figure>
  <div class="split__text">
    <p class="label">First Date</p>
    <p class="bigdate" id="bigDate"></p>
    <p id="dateCaption"></p>
  </div>
</section>

<section class="section reveal" id="timeline">
  <p class="label">Perjalanan</p>
  <h2>Momen yang kita simpan</h2>
  <ol class="timeline" id="timelineList"></ol>
</section>

<section class="moments reveal" id="galeri">
  <div class="moments__head section">
    <div><p class="label">Momen Kita</p><h2>Pameran kecil kita</h2></div>
    <div class="moments__ctl" id="momentsCtl">
      <button class="icon-btn" id="stripPrev" type="button" aria-label="Geser ke kiri">‹</button>
      <button class="icon-btn" id="stripNext" type="button" aria-label="Geser ke kanan">›</button>
    </div>
  </div>
  <div class="moments__track" id="stripTrack" tabindex="0" aria-label="Deretan foto kenangan, geser ke samping"></div>
  <div class="moments__bar"><i id="stripProgress"></i></div>
</section>

<section class="section center quote reveal" id="kutipan">
  <blockquote><p id="quoteText"></p></blockquote>
  <button class="link-btn" id="quoteBtn" type="button">Kutipan lain</button>
</section>

<section class="section details reveal" id="detail">
  <p class="label">Hal-hal kecil</p>
  <dl class="details__list" id="detailList"></dl>
</section>

<section class="section anniv reveal" id="anniversary">
  <p class="label">Hari Jadi Kita</p>
  <p class="anniv__date" id="annivDate"></p>
  <p class="anniv__note" id="annivNote"></p>
</section>

<section class="section center final reveal" id="akhir"><p id="endingText"></p></section>
</main>

<footer class="footer" id="footer"></footer>

<div class="player" id="player" hidden>
  <button class="player__btn" id="playBtn" type="button" aria-label="Putar musik">▶</button>
  <div class="player__info"><span class="player__title" id="songTitle"></span><span class="player__bar"><i id="progress"></i></span></div>
  <span class="viz" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
</div>
<div class="cursor" id="cursor" aria-hidden="true"></div>
<audio id="audio" preload="none" loop></audio>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Pratinjau foto" hidden>
  <button class="lb__close" id="lbClose" type="button" aria-label="Tutup">✕</button>
  <button class="lb__nav lb__prev" id="lbPrev" type="button" aria-label="Sebelumnya">‹</button>
  <button class="lb__nav lb__next" id="lbNext" type="button" aria-label="Berikutnya">›</button>
  <div class="lb__body"><img id="lbImg" alt=""><div class="lb__meta" id="lbMeta"></div></div>
</div>

<script src="js/config.js"></script>
<script src="js/quotes.js"></script>
<script src="js/gallery.js"></script>
<script src="js/app.js"></script>
</body>
</html>
